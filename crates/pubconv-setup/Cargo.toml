[package]
name = "pubconv-setup"
version = "1.0.0"
edition.workspace = true
license.workspace = true
description = "PubConv's installer and uninstaller, styled like the app."

[[bin]]
name = "pubconv-setup"
path = "src/main.rs"

[dependencies]
flate2 = "1"
serde_json = "1.0.154"
tao = "0.37.2"
winapi = { version = "0.3", features = ["combaseapi", "objbase", "objidl", "shlobj", "shobjidl_core", "unknwnbase", "winerror", "winuser"] }
wry = "0.57.1"

[build-dependencies]
winresource = "0.1"
