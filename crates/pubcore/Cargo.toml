[package]
name = "pubcore"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reads Microsoft Publisher (.pub) files: WordArt, text stories, linked text flow."

[dependencies]
cfb = "0.10"
ttf-parser = "0.25"
fontdb = "0.23"
hyphenation = { version = "0.8", features = ["embed_en-us"] }
thiserror = "2"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
rustybuzz = "0.20.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
